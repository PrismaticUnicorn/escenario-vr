<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <title>Ofrenda Low Poly</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    
<canvas id="myCanvas"></canvas>

<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
    }
</script>

<script type="module"> 
    import * as THREE from 'three'; 
    import { OrbitControls } from 'three/OrbitControls';

    // 🕹️ Renderer
    var renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('myCanvas'), 
        antialias: true
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    // 🎬 Escena
    var scene = new THREE.Scene();
    
    // 🎥 Cámara
    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 20, 45);
    scene.add(camera);

    // 🎮 Controls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
//fondo textura
 var loader = new THREE.TextureLoader();
        var bgtexture = loader.load("./assets/void.jpg");
        scene.background=bgtexture;



    // 💫 LUCES
    var light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(20, 40, 30);
    light.target.position.set(0, 0, 0);
    light.castShadow = true;
    light.shadow.bias = 0.001;
    light.shadow.mapSize.width = 1048;
    light.shadow.mapSize.height = 2048;
    light.shadow.camera.top = 50;
    light.shadow.camera.right = 50;
    light.shadow.camera.left = -50;
    light.shadow.camera.bottom = -50;
    scene.add(light);

    var light3 = new THREE.HemisphereLight(0x9C6416, 0x783D13, 0.8);
    light3.position.set(100, 20, 0);
    scene.add(light3);

    // ✏️ OBJETOS DE LA OFRENDA 

     // Base
    var geometry01 = new THREE.BoxGeometry(1500, 0.5, 1500);
    var material01 = new THREE.MeshLambertMaterial({
        color: 0x000000,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh01 = new THREE.Mesh(geometry01, material01);
    mesh01.position.set(0, 10, 0);
    mesh01.receiveShadow = true;
    scene.add(mesh01);

    /*

    // 🎰 Rendering y animación
    function render() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
