<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Tumba</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
//😒Grids
var gridHelper = new THREE.GridHelper(200,200);
scene.add(gridHelper);

var polargrid = new THREE.PolarGridHelper(200,40,20,20);
//scene.add(polargrid); 

// Espacio para colocar los objetos
// Ejes 
var axes = new THREE.AxesHelper(100);
scene.add(axes); 

//Textura

///  💫💢🐭🐭 LUCES

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
var light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(0, 30, 40);
light.target.position.set(0, 0, 0); //cuando hay sombra
light.castShadow = true;
light.shadow.bias = 0.01;
light.shadow.mapSize.width = 512*3;
light.shadow.mapSize.height = 512*3;

light.shadow.camera.top=25;
light.shadow.camera.right=25;
light.shadow.camera.left=-25;
light.shadow.camera.bottom=-25;
light.shadow.camera.visible=true;

var directionalHelper = new THREE.CameraHelper(light.shadow.camera);
//scene.add(directionalHelper);
//scene.add(light);

var light1 = new THREE.AmbientLight(0xffffff,1.5);
scene.add (light1); 

var light2 = new THREE.DirectionalLight(0xffffff,1.4);
//scene.add (light2);
light2.position.set(0,40,0);


var light3 = new THREE.HemisphereLight(0xffffff,0xffffff,0.8);
//scene.add (light3);
light3.position.set(0,40,0);

//OBJETOS  ✏️✏️✏️✏️  🪶

//Cuerpo
    var CueGeo = new THREE.BoxGeometry(5,8,1.5);
    var texture = new THREE.TextureLoader().load ("./assets/roca2.jpg");
    var CueMat =new THREE.MeshLambertMaterial({
        map:texture,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh01 = new THREE.Mesh(CueGeo, CueMat);
    mesh01.position.set(0, 5.5, 0);
    mesh01.castShadow = true;
    scene.add(mesh01);
//Marco
 var MarGeo1 = new THREE.BoxGeometry(6,1.5,2.5);
    var texture = new THREE.TextureLoader().load ("./assets/roca2.jpg");
    var MarMat01 =new THREE.MeshLambertMaterial({
        map:texture,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh02 = new THREE.Mesh(MarGeo1, MarMat01);
    mesh02.position.set(0, 10, 0);
    mesh02.castShadow = true;
    scene.add(mesh02);

    var MarGeo2= new THREE.BoxGeometry(3,1.5,2.1);
    var texture = new THREE.TextureLoader().load ("./assets/roca2.jpg");
    var MarMat02 =new THREE.MeshLambertMaterial({
        map:texture,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh03 = new THREE.Mesh(MarGeo2, MarMat02);
    mesh03.position.set(3.4, 9.2, 0);
    mesh03.castShadow = true;
    mesh03.rotation.z -=0.9;
    scene.add(mesh03);

    var MarGeo2= new THREE.BoxGeometry(3,1.5,2.1);
    var texture = new THREE.TextureLoader().load ("./assets/roca2.jpg");
    var MarMat02 =new THREE.MeshLambertMaterial({
        map:texture,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh04 = new THREE.Mesh(MarGeo2, MarMat02);
    mesh04.position.set(-3.4, 9.2, 0);
    mesh04.castShadow = true;
    mesh04.rotation.z +=0.9;
    scene.add(mesh04);

//Base
    var MarGeo2= new THREE.BoxGeometry(7,1.5,3);
    var texture = new THREE.TextureLoader().load ("./assets/roca2.jpg");
    var MarMat02 =new THREE.MeshLambertMaterial({
        map:texture,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh05 = new THREE.Mesh(MarGeo2, MarMat02);
    mesh05.position.set(0, 0.8, 0);
    mesh05.castShadow = true;
    scene.add(mesh05);
//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
