            "three": "./js/three.module.js",

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

//OBJETOS  ✏️✏️✏️✏️  🪶

// 1. CERA
    var geometry01 = new THREE.CylinderGeometry(2, 2, 10, 32);
    var matVela01 = new THREE.MeshLambertMaterial({
        color: 0xFFF8DC,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh01 = new THREE.Mesh(geometry01, matVela01);
    mesh01.position.set(0, 5, 0);
    mesh01.castShadow = true;
    scene.add(mesh01);

    // 2. MECHA
    var geometry02 = new THREE.CylinderGeometry(0.1, 0.1, 1, 16);
    var matVela02 = new THREE.MeshLambertMaterial({
        color: 0x111111,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh02 = new THREE.Mesh(geometry02, matVela02);
    mesh02.position.set(0, 10.5, 0);
    mesh02.castShadow = true;
    scene.add(mesh02);

    // 3. LLAMA
    var geometry03 = new THREE.ConeGeometry(0.6, 1.8, 16);
    var matVela03 = new THREE.MeshLambertMaterial({
        color: 0xff6600,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh03 = new THREE.Mesh(geometry03, matVela03);
    mesh03.position.set(0, 11.6, 0);
    mesh03.castShadow = true;
    scene.add(mesh03);

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
