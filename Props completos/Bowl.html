<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Práctica 01 - Tazón con Frutas</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);

// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 15);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

// Espacio para colocar los objetos

///  💫💢🐭🐭 LUCES
// Luz ambiental
var luzAmbiental = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(luzAmbiental);

//OBJETOS  ✏️✏️✏️✏️  🪶
// Tazón
// Materiales
var matTazon = new THREE.MeshLambertMaterial(
    {color: 0x8b5a2b, 
        flatShading: true,
    }
);

var matManzana = new THREE.MeshLambertMaterial(
    {color: 0xd92b2b, 
        flatShading: true,
    }
);

var matNaranja = new THREE.MeshLambertMaterial(
    {color: 0xf28500, 
        flatShading: true,
    }
);

var matPlatano = new THREE.MeshLambertMaterial(
    {color: 0xe5e045, 
        flatShading: true,
    }
);

// Geometría y Mesh del Tazón
var geoTazon = new THREE.CylinderGeometry(2.5, 1.5, 1.2, 12);
var tazon = new THREE.Mesh(geoTazon, matTazon);
scene.add(tazon);
tazon.position.set(0, 0.6, 0);

// Geometría y Mesh de la Manzana
var geoManzana = new THREE.SphereGeometry(0.7, 8, 8);
var manzana = new THREE.Mesh(geoManzana, matManzana);
scene.add(manzana);
manzana.position.set(0.6, 1.5, 0.5);

// Geometría y Mesh de la Naranja
var geoNaranja = new THREE.SphereGeometry(0.75, 8, 8);
var naranja = new THREE.Mesh(geoNaranja, matNaranja);
scene.add(naranja);
naranja.position.set(-0.7, 1.5, -0.3);

// Geometría y Mesh del Plátano (Cilindro delgado y alargado)
var geoPlatano = new THREE.CylinderGeometry(0.18, 0.18, 2.0, 6);
var platano = new THREE.Mesh(geoPlatano, matPlatano);
scene.add(platano);
platano.position.set(0.2, 1.8, -0.8);
platano.rotation.z = 1.57;
platano.rotation.y = 0.5;  


//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
