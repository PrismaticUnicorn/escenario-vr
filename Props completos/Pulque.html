<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Pulque</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
//😒Grids
var gridHelper = new THREE.GridHelper(200,200);
scene.add(gridHelper);
var polargrid = new THREE.PolarGridHelper(200,40,20,20);
//scene.add(polargrid); 
// Espacio para colocar los objetos
// Ejes 
var axes = new THREE.AxesHelper(100);
scene.add(axes); 
///  💫💢🐭🐭 LUCES


renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
var light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(0, 30, 40);
light.target.position.set(0, 0, 0); //cuando hay sombra
light.castShadow = true;
light.shadow.bias = 0.01;
light.shadow.mapSize.width = 512*3;
light.shadow.mapSize.height = 512*3;

light.shadow.camera.top=25;
light.shadow.camera.right=25;
light.shadow.camera.left=-25;
light.shadow.camera.bottom=-25;
light.shadow.camera.visible=true;

var directionalHelper = new THREE.CameraHelper(light.shadow.camera);
//scene.add(directionalHelper);
scene.add(light);

var light1 = new THREE.AmbientLight(0xffffff,1.5);
//scene.add (light1); 

var light2 = new THREE.DirectionalLight(0xffffff,1.4);
//scene.add (light2);
light2.position.set(0,40,0);


var light3 = new THREE.HemisphereLight(0xffffff,0xffffff,0.8);
//scene.add (light3);
light3.position.set(0,40,0);

//OBJETOS  ✏️✏️✏️✏️  🪶
var geometry01 = new THREE.SphereGeometry(3, 10, 10);
    var matFlor01 = new THREE.MeshLambertMaterial({
        color: 0xD2691E,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh01 = new THREE.Mesh(geometry01, matFlor01);
    mesh01.position.set(0, 4.2, 0);
    mesh01.castShadow = true;
    scene.add(mesh01);

//Cuello
    var CuellBo = new THREE.CylinderGeometry(2.5, 2, 2, 10, 10, true);
    var matBotella03 = new THREE.MeshLambertMaterial({
    color: 0xD2691E,
    side: THREE.DoubleSide,
    flatShading: true
     
    });
var mesh02 = new THREE.Mesh(CuellBo, matBotella03);
    mesh02.position.set(0, 7, 0);
    mesh02.scale.y = 1.2;
    mesh02.castShadow = true;
    scene.add(mesh02);

//asa
    var Asa = new THREE.TorusGeometry(1.5);
    var AsaMat = new THREE.MeshLambertMaterial({
    color: 0xD2691E,
    side: THREE.DoubleSide,
    flatShading: true 
    });
var mesh03 = new THREE.Mesh(Asa, AsaMat);
    mesh03.position.set(-2.9, 4.8, 0);
    mesh03.scale.y = 1.2;
    mesh03.castShadow = true;
    scene.add(mesh03);

    side: THREE.DoubleSide,
    flatShading: true 
    });
var mesh04 = new THREE.Mesh(Pulque, PulMat);
    mesh04.position.set(0, 7, 0);
    mesh04.scale.y = 1.2;
    mesh04.castShadow = true;
    scene.add(mesh04);

//Decoración
 
var Flor1 = new THREE.SphereGeometry(0.4, 10, 10);
    var matFlor01 = new THREE.MeshLambertMaterial({
        color:0xFFA500,

        flatShading: true
    });
    var mesh05 = new THREE.Mesh(Flor1, matFlor01);
    mesh05.position.set(0, 4, 2.8);
    mesh05.castShadow = true;
    scene.add(mesh05);

var Flor2 = new THREE.SphereGeometry(0.3, 10, 10);

        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh06 = new THREE.Mesh(Flor2, matFlor02);
    mesh06.position.set(0, 4.75, 2.8);

    scene.add(mesh06);

var Flor3 = new THREE.SphereGeometry(0.3, 10, 10);

    scene.add(mesh07);

var Flor4 = new THREE.SphereGeometry(0.3, 10, 10);
    var matFlor04 = new THREE.MeshLambertMaterial({
        color: 0x000080,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh08 = new THREE.Mesh(Flor4, matFlor04);
    mesh08.position.set(0.75, 4, 2.8);
    mesh08.castShadow = true;
    scene.add(mesh08);

var Flor5 = new THREE.SphereGeometry(0.3, 10, 10);
    var matFlor05 = new THREE.MeshLambertMaterial({
        color: 0x000080,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh09 = new THREE.Mesh(Flor5, matFlor05);
    mesh09.position.set(-0.75, 4, 2.8);
    mesh09.castShadow = true;
    scene.add(mesh09);

    //Decoracion de atras
    var Flor6 = new THREE.SphereGeometry(0.4, 10, 10);
    var matFlor06 = new THREE.MeshLambertMaterial({
        color:0xFFA500,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh10 = new THREE.Mesh(Flor6, matFlor06);
    mesh10.position.set(0, 4, -2.8);
    mesh10.castShadow = true;
    scene.add(mesh10);

var Flor7 = new THREE.SphereGeometry(0.3, 10, 10);
    var matFlor07 = new THREE.MeshLambertMaterial({
        color: 0x000080,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh11 = new THREE.Mesh(Flor7, matFlor07);
    mesh11.position.set(0, 4.75, -2.8);
    mesh11.castShadow = true;
    scene.add(mesh11);

var Flor8 = new THREE.SphereGeometry(0.3, 10, 10);
    var matFlor08 = new THREE.MeshLambertMaterial({
        color: 0x000080,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh12 = new THREE.Mesh(Flor8, matFlor08);
    mesh12.position.set(0, 3.25, -2.8);
    mesh12.castShadow = true;
    scene.add(mesh12);

var Flor9 = new THREE.SphereGeometry(0.3, 10, 10);
    var matFlor09 = new THREE.MeshLambertMaterial({
        color: 0x000080,

        flatShading: true
    });
    var mesh13 = new THREE.Mesh(Flor9, matFlor09);
    mesh13.position.set(0.75, 4, -2.8);
    mesh13.castShadow = true;
    scene.add(mesh13);

var Flor10 = new THREE.SphereGeometry(0.3, 10, 10);
    var matFlor10 = new THREE.MeshLambertMaterial({
        color: 0x000080,
        side: THREE.DoubleSide,
        flatShading: true
    });
    var mesh14 = new THREE.Mesh(Flor10, matFlor10);
    mesh14.position.set(-0.75, 4, -2.8);
    mesh14.castShadow = true;
    scene.add(mesh14);   

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
