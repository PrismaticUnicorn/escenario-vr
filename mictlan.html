    // 🕹️ Renderer
    var renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('myCanvas'), 
        antialias: true
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    // 🎬 Escena
    var scene = new THREE.Scene();
    
    // 🎥 Cámara
    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 40+0, 750);

    scene.add(camera);

    // 🎮 Controls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
//fondo textura

    light.castShadow = true;
    light.shadow.bias = 0.001;
    light.shadow.mapSize.width = 1048;
    light.shadow.mapSize.height = 2048;
    light.shadow.camera.top = 50;
    light.shadow.camera.right = 50;
    light.shadow.camera.left = -50;
    light.shadow.camera.bottom = -50;
    scene.add(light);

    var light3 = new THREE.HemisphereLight(0x800909, 0x124B96, 1.2);
