<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <title>Ofrenda Low Poly</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    
<canvas id="myCanvas"></canvas>

<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
    }
</script>

<script type="module"> 
    import * as THREE from 'three'; 
    import { OrbitControls } from 'three/OrbitControls';

    // 🕹️ Renderer
    var renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('myCanvas'), 
        antialias: true
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    // 🎬 Escena
    var scene = new THREE.Scene();

    // 🎥 Cámara
    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 20, 45);
    scene.add(camera);

    // 🎮 Controls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 💫 LUCES
    var light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(20, 40, 30);
    light.target.position.set(0, 0, 0);
    light.castShadow = true;
    light.shadow.bias = 0.001;
    light.shadow.mapSize.width = 1048;
    light.shadow.mapSize.height = 2048;
    light.shadow.camera.top = 50;
    light.shadow.camera.right = 50;
    light.shadow.camera.left = -50;
    light.shadow.camera.bottom = -50;
    scene.add(light);

    var light3 = new THREE.HemisphereLight(0xfff, 0x444444, 0.8);
    light3.position.set(10, 20, 0);
    scene.add(light3);

    // ✏️ OBJETOS DE LA OFRENDA 
//side: THREE.DoubleSide,

    //Botella
    var geometry01 = new THREE.CylinderGeometry(1, 1.6, 2, 8);
    var matBotella01 = new THREE.MeshLambertMaterial({
    color: 0x0B540C,
    transparent:true,
    opacity:0.7, 
    flatShading: true 
    });

    var mesh01 = new THREE.Mesh(geometry01, matBotella01);
    mesh01.position.set(15, 5, 0);
    mesh01.scale.set(1.2, 1.8, 1.2);
    mesh01.castShadow = true;
    scene.add(mesh01);

    //CuerpoBotella
    var CuerBo = new THREE.CylinderGeometry(1.5, 1.5, 5, 8);
    var matBotella02 = new THREE.MeshLambertMaterial({
    color: 0x0B540C,
    transparent:true,
    opacity:0.7, 
    flatShading: true 
    });

    var mesh02 = new THREE.Mesh(CuerBo, matBotella02);
    mesh02.position.set(15, 7, 0);
    mesh02.scale.y = 1.2;
    mesh02.castShadow = true;
    scene.add(mesh02);

     //Cuello
    var CuellBo = new THREE.CylinderGeometry(1, 1, 2, 8);
    var matBotella03 = new THREE.MeshLambertMaterial({
    color: 0x0B540C,
    transparent:true,
    opacity:0.7, 
    flatShading: true 
    });

    var mesh03 = new THREE.Mesh(CuellBo, matBotella03);
    mesh03.position.set(15, 11, 0);
    mesh03.scale.set(0.8, 1, 0.8);
    mesh03.castShadow = true;
    scene.add(mesh03);

    //Etiqueta
    var EtiGeo = new THREE.CylinderGeometry(1.6, 1.6, 2.5, 8);
    var matEtiqueta = new THREE.MeshLambertMaterial({
    color: 0xEEF5E9,
    flatShading: true 
    });

    var mesh04 = new THREE.Mesh(EtiGeo, matEtiqueta);
    mesh04.position.set(15, 7, 0);
    mesh04.scale.set = 12;
    mesh04.castShadow = true;
    scene.add(mesh04);

    //Tapon
    var TaGeo = new THREE.CylinderGeometry(0.7, 0.7, 1, 8);
    var matTapon = new THREE.MeshLambertMaterial({
    color: 0x946801,
    flatShading: true 
    });

    var mesh05 = new THREE.Mesh(TaGeo, matTapon);
    mesh05.position.set(15, 12, 0);
    mesh05.scale.set(0.8, 1, 0.8);
    mesh05.castShadow = true;
    scene.add(mesh05);


    // 🎰 Rendering y animación
    function render() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
